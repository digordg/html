<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gray{
            background-color: gray;
            color: white;
        }
        table{
            font-family: Arial, Helvetica, sans-serif;
            border-collapse: collapse;
        }
        tr,td ,th{
            
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Tabela de Notas</h1>
    <table>
        <tr>
            <th rowspan="2" scope="col" class="gray">Área</th>
            <th rowspan="2" scope="col" class="gray">Diciplinas</th>
            <th colspan="2" scope="col" class="gray">Notas</th>
            
            <th rowspan="2" scope="col" class="gray">média</th>
        </tr>
        <tr>
            <th rowspan="-2" scope="col" class="gray">Nota1</th>
            <th rowspan="-2" scope="col" class="gray">Nota2</th>
        </tr>
        <tr>
            <th rowspan="4" scope="rowgroup">Exatas</th>
            <td>matemática</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td>física</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td>Química</td> 
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr> 
            <td>Biologia</td> 
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <th colspan="4" scope="row" class="gray">Média de Exatas</th>
            <td class="gray">0.0</td>

        </tr>
        <tr>
            <th rowspan="2" scope="rowgroup">Humanas</th>
            <td>História</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td>Geografia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <th colspan="4" scope="row" class="gray">Média de humanas</th>
            <td class="gray">0.0</td>
        </tr>
    </table>
</body>
</html>
