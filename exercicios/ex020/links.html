<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links
    </title>
    <style>
        /*
        SELETORES PERSONALIZADOS
        #  = id
        .  = class
        :  = pseudo-class
        :: = pseudo-element
        >  = children (filho)
        */
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
            color: red;
            text-decoration: none;
        }
        a:visited{
color: darkred;
        }
        a:hover{
            color: black;
            text-decoration: underline;
        }
        /*muda a cor no momento do click*/
        a:active{
            color: yellow;

        }
        .especial{
            background-color: rgb(246, 138, 138);
        }
        /*site para símbolos : (erikasart.com)*/
        .especial::before{
            content: '⇒';
        }
        /* after=depois
           before=antes */
        .especial::after{
            content: '⇐';
            
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io">Repositório GitHub</a></li>
        <li><a href="https://youtube.com/cursoemvideo/" class="especial">Canal do YouTube</a></li>
        <li><a href="https://www.cursoemvideo.com">Site do CursoemVideo</a></li>
    </ul>
</body>
</html>
